schema_version: policy.v1
rule_id: bd.finance.mfs_unauthorized_charge
status: draft
jurisdiction: BD
issue_type: mfs_unauthorized_charge
date_basis: conduct_date
statutory_citations:
  - bb_cipc:stage:1
  - bb_cipc:stage:2
source_dependencies:
  - bb_cipc_procedure
supported_remedies:
  - full_refund
  - account_security_restore
unsupported_remedies:
  - punitive_damages
  - criminal_fine_to_consumer
conditions:
  all:
    - eq:
        fact: payment_instrument_kind
        value: mfs_wallet
    - eq:
        fact: transaction_unauthorized
        value: true
    - eq:
        fact: provider_ticket_filed
        value: true
exclusions:
  - eq:
      fact: otp_pin_voluntarily_shared_to_fraudster
      value: true
unknown_behavior: ask_material_question
reason_templates:
  supported: reasons.finance.mfs_charge_eligible_for_bb_escalation
  excluded: reasons.finance.mfs_charge_excluded_pin_sharing
  unknown: reasons.finance.mfs_charge_needs_ticket
  not_supported: reasons.finance.mfs_charge_not_supported
allowed_actions:
  - prepare_provider_formal_letter
  - prepare_bb_cipc_escalation
