[project]
name = "claimcraft-backend"
version = "0.1.0"
description = "ClaimCraft BD FastAPI Backend and Core Resolution Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "pillow>=13.0.0",
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
    "bm25s>=0.3.16",
    "reportlab>=5.1.0",
    "uharfbuzz>=0.57.0",
    "fonttools>=4.68.0",
    "brotli>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "reportlab>=5.1.0",
]
